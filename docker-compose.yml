services:
  db:
    image: postgres:16
    container_name: fretesil-db
    environment:
      POSTGRES_DB: ${DB_NAME:-fretesil}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fretesil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend/fretesil
    container_name: fretesil-web
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me}
      DEBUG: ${DEBUG:-True}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-fretesil}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-12345}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
