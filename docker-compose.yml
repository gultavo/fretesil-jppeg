services:
  db:
    image: postgres:16
    container_name: fretesil-db
    environment:
      POSTGRES_DB: ${DB_NAME:-fretesil}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Banco acessivel apenas neste computador
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fretesil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend/fretesil
    # Nome da imagem publicada no Docker Hub (docker compose build/push web)
    image: ${DOCKERHUB_USER:-seu_usuario}/fretesil-web:${IMAGE_TAG:-latest}
    container_name: fretesil-web
    environment:
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,10.0.2.2}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PRECO_COMBUSTIVEL_PADRAO: ${PRECO_COMBUSTIVEL_PADRAO:-6.00}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-fretesil}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      # Mantem as fotos enviadas quando o container e recriado
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
